<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LeadDesk Mini | Capture Leads</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav>
            <h2>🚀 LeadDesk Mini</h2>
        </nav>
    </header>


    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">

            <h1>
                Grow Your Business With Smart Lead Management
            </h1>

            <p>
                Capture potential customers and manage your leads
                efficiently from one simple dashboard.
            </p>

        </div>


        <!-- Lead Form -->

        <div class="form-container">

            <h2>Get Started</h2>

            <form id="leadForm">


                <input 
                type="text" 
                id="name"
                placeholder="Your Name"
                >


                <input 
                type="email" 
                id="email"
                placeholder="Your Email"
                >


                <select id="budget">

                    <option value="">
                        Select Budget Range
                    </option>

                    <option>
                        $500 - $1,000
                    </option>

                    <option>
                        $1,000 - $5,000
                    </option>

                    <option>
                        $5,000+
                    </option>

                </select>


                <textarea 
                id="message"
                placeholder="Your Message">
                </textarea>


                <button type="submit">
                    Submit
                </button>


                <p id="responseMessage"></p>


            </form>

        </div>


    </section>



<script src="js/script.js"></script>

</body>

</html>
